<!DOCTYPE html>
<html lang="ko" data-brand="{{BRAND}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 완료 · {{BRAND_NAME}}</title>
<meta name="description" content="{{BRAND_NAME}} 로그인이 완료되었습니다. 카카오톡 채팅방으로 돌아가 하시려던 작업을 계속해 주세요.">
<meta name="robots" content="noindex">
<meta property="og:title" content="로그인 완료 · {{BRAND_NAME}}">
<meta property="og:description" content="로그인이 완료되었습니다. 카카오톡 채팅방으로 돌아가 계속 진행해 주세요.">
<link rel="icon" type="{{BRAND_ICON_TYPE}}" href="{{BRAND_ICON}}">
<link rel="apple-touch-icon" href="{{BRAND_APPLE_ICON}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/brand.css">
<style>
  :root {
    /* {{BRAND_NAME}} Figma 토큰 (TASK-212) */
    --handol-main: #3882D3;
    --handol-main-soft: #ECF4FD;
    --handol-main-soft-2: #E8F0FC;
    --handol-on-main: #FDFDFD;
    --handol-text: #040404;
    --handol-text-50: rgba(4, 4, 4, 0.5);
    --handol-slate: #404756;
    --handol-text-muted: var(--handol-slate);
    --handol-bg: #FDFDFD;
    --handol-surface: #FFFFFF;
    --handol-line: #D5DAE5;
    --handol-sky: #95D4E7;
    --handol-pink-soft: #FFE1E2;
    --handol-inactive: #A4ABBD;
    --handol-dark: #12131A;
  }
  :root {
    --bg: var(--handol-bg);
    --surface: var(--handol-surface);
    --ink: var(--handol-text);
    --muted: var(--handol-text-muted);
    --line: var(--handol-line);
    --brand: var(--handol-main);
    --brand-soft: var(--handol-main-soft);
    --ok: var(--ok-c);
    --ok-soft: var(--ok-soft-c);
    --kakao: #FEE500;
    --kakao-ink: #191600;
    --shadow: 0 20px 50px rgba(4, 4, 4, 0.12);
  }

  body::before { content: ""; position: fixed; top: -90px; left: 50%; margin-left: -259px; width: 518px; height: 518px; border-radius: 50%; background: rgba(139, 124, 246, 0.1); filter: blur(129px); z-index: -1; pointer-events: none; display: var(--glow-display); }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Pretendard Variable", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.6;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 44px 32px 36px;
    text-align: center;
  }

  .logo {
    width: 56px; height: 56px;
    display: block;
    margin: 0 auto 24px;
    object-fit: cover;
  }

  .check {
    width: 76px; height: 76px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: var(--ok-soft);
    color: var(--ok);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 900;
    line-height: 1;
  }
  @media (prefers-reduced-motion: no-preference) {
    .check { animation: pop 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
    @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  }

  h1 {
    font-size: clamp(24px, 6vw, 30px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
    text-wrap: balance;
  }
  .lede {
    color: var(--muted);
    font-size: 16px;
    margin: 0 0 28px;
  }

  .tip {
    background: var(--brand-soft);
    border: 1px solid var(--brand);
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 14.5px;
    color: var(--ink);
    text-align: center;
  }
  .tip .say {
    display: inline-block;
    background: var(--say-bg);
    color: var(--say-fg);
    border-radius: 6px;
    padding: 1px 8px;
    font-weight: 800;
    white-space: nowrap;
  }

  footer {
    margin-top: 24px;
    color: var(--muted);
    font-size: 12.5px;
  }

  @media (max-width: 400px) {
    .card { padding: 36px 22px 28px; border-radius: 20px; }
  }
</style>
</head>
<body>
  <main class="card">
    <img class="logo bi" src="{{BRAND_ICON}}" alt="{{BRAND_NAME}}" width="56" height="56">
    <div class="check" aria-hidden="true">✓</div>
    <h1>로그인이 완료되었습니다</h1>
    <p class="lede">이제 카카오톡 채팅방으로 돌아가서<br>하시려던 작업을 계속해 주세요.</p>
    <div class="tip">
      로그인 여부를 확인하고 싶으시다면<br>
      채팅방에 <span class="say">계정정보</span> 를 입력하세요.
    </div>
    <footer>{{BRAND_NAME}}({{BRAND_NAME_EN}}) · 한국공학대학교 학생 챗봇</footer>
  </main>
</body>
</html>
