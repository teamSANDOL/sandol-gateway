server {
    listen 80;
    server_name sandori.kr sandol.sio2.kr localhost sandol.house.sio2.kr fastapi.house.sio2.kr 10.10.10.102;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 관측용 JSON 액세스 로그 (형식 정의는 00-limits.conf)
    # http 컨텍스트가 아니라 server 에 두어야 이미지 기본 설정과
    # 겹쳐 같은 요청이 두 번 기록되는 것을 막는다.
    access_log /dev/stdout sandol_json;

    # 라우트 함수들
    include /etc/nginx/conf.d/routes/*.conf;
}
