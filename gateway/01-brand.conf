# 접속 도메인별 랜딩 브랜드 분기 (TASK-212)
# 같은 landing HTML 한 벌을 쓰고, 응답할 때 routes/brand-sub.inc 의 sub_filter 가
# {{BRAND_*}} 토큰을 아래 값으로 치환한다. 색·장식은 assets/brand.css 가 html[data-brand] 로 분기한다.
# 알 수 없는 호스트(sandori.kr, 기존 server_name, IP 직접 접속)는 현재 운영 브랜드인 sandol 이다.
map $host $brand {
    default        sandol;
    handol.app     handol;
    www.handol.app handol;
}

map $brand $brand_name        { default "산돌이";            handol "한돌이"; }
map $brand $brand_name_en     { default "SANDOL";            handol "HANDOL"; }
map $brand $brand_domain      { default "sandori.kr";        handol "handol.app"; }
map $brand $brand_mascot_alt  { default "산돌이 마스코트";   handol "한냥 마스코트"; }
map $brand $brand_restaurant { default "산돌식당"; handol "한돌식당"; }
map $brand $brand_icon        { default "/assets/sandol-logo.png";  handol "/assets/handol-icon.svg"; }
map $brand $brand_icon_type   { default "image/png";                handol "image/svg+xml"; }
map $brand $brand_apple_icon  { default "/assets/sandol-logo.png";  handol "/assets/handol-icon-180.png"; }
