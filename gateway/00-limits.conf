# -----------------------------------------------------------
# JSON 액세스 로그
#
# 파일명이 00- 으로 시작하는 것은 필수다.
# nginx 는 conf.d/*.conf 를 알파벳 순으로 읽으므로, log_format 정의가
# default.conf 보다 먼저 로드되지 않으면 access_log 지시자가
# "unknown log format" 으로 기동에 실패한다.
# -----------------------------------------------------------

# 아래 로그에서 remote_addr 이 하나로 고정되면 프록시가 있는 것이고,
# 그때 주석을 풀고 대역을 채운다.
# set_real_ip_from  <프록시 대역>;
# real_ip_header    X-Forwarded-For;
# real_ip_recursive on;

log_format sandol_json escape=json
  '{"time":"$time_iso8601"'
  ',"remote_addr":"$remote_addr"'
  ',"xff":"$http_x_forwarded_for"'
  ',"method":"$request_method"'
  ',"uri":"$uri"'
  ',"status":$status'
  ',"request_time":$request_time'
  ',"upstream_time":"$upstream_response_time"'
  ',"bytes":$body_bytes_sent'
  ',"ua":"$http_user_agent"'
  '}';
