# -----------------------------------------------------------
# JSON 액세스 로그
#
# 파일명이 00- 으로 시작하는 것은 필수다.
# nginx 는 conf.d/*.conf 를 알파벳 순으로 읽으므로, log_format 정의가
# default.conf 보다 먼저 로드되지 않으면 access_log 지시자가
# "unknown log format" 으로 기동에 실패한다.
# -----------------------------------------------------------

# 게이트웨이 앞에는 항상 프록시가 있다는 전제로 시작한다.
# 진입 경로는 Cloudflare Tunnel(cloudflared)과 Nginx Proxy Manager 두 가지이며,
# 둘을 동시에 신뢰하므로 DNS 레코드만 바꿔 오갈 수 있다.
#
# real_ip_header 는 하나만 지정할 수 있다. X-Real-IP 는 Cloudflare 가 제거하고,
# CF-Connecting-IP 는 NPM 이 보내지 않으므로 두 경로에 모두 있는 X-Forwarded-For 를 쓴다.
# 두 프록시 모두 XFF 맨 끝에 자신이 직접 본 접속 IP 를 덧붙인다.
#  - NPM v2.16.0 proxy.conf: $proxy_add_x_forwarded_for
#  - Cloudflare: 기존 XFF 가 있으면 덮어쓰지 않고 뒤에 append
#    (developers.cloudflare.com/fundamentals/reference/http-headers/)
#  - 운영 로그 확인: 평소 요청의 XFF 는 cf_ip 한 개다. cloudflared 는 자기 IP 를 추가하지 않는다.
# 클라이언트는 앞쪽 값만 조작할 수 있다. real_ip_recursive on 이면 신뢰 목록에 있는
# 주소를 오른쪽부터 건너뛰고 처음 만나는 비신뢰 값을 클라이언트 IP 로 쓰므로 위조가 통하지 않는다.
# 원래 연결 주소(프록시 IP)는 $realip_remote_addr 에 남는다.
set_real_ip_from 172.30.1.110;   # cloudflared CT110 (pve1). 프록시가 바뀌면 set_real_ip_from 줄만 수정
set_real_ip_from 172.30.1.75;    # cloudflared CT131 (pve2)
set_real_ip_from 172.30.1.114;   # Nginx Proxy Manager CT114 (pve1)
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

# CF-Ray 끝 세 글자(엣지 colo) 추출
map $http_cf_ray $cf_colo { "~-(?<c>[A-Z]{3})$" $c; default ""; }

# WebSocket(Upgrade) 프록시용 Connection 헤더 계산.
# 일반 HTTP 요청(Upgrade 헤더 없음)에서는 "close"로 keepalive를 막지 않는다.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

log_format sandol_json escape=json
  '{"time":"$time_iso8601"'
  ',"remote_addr":"$remote_addr"'
  ',"proxy_addr":"$realip_remote_addr"'
  ',"host":"$host"'
  ',"xff":"$http_x_forwarded_for"'
  ',"method":"$request_method"'
  ',"uri":"$uri"'
  ',"status":$status'
  ',"request_time":$request_time'
  ',"upstream_time":"$upstream_response_time"'
  ',"bytes":$body_bytes_sent'
  ',"cf_ray":"$http_cf_ray"'
  ',"colo":"$cf_colo"'
  ',"cf_country":"$http_cf_ipcountry"'
  ',"cf_ip":"$http_cf_connecting_ip"'
  ',"req_len":$request_length'
  ',"up_connect":"$upstream_connect_time"'
  ',"up_header":"$upstream_header_time"'
  ',"ua":"$http_user_agent"'
  '}';

# -----------------------------------------------------------
# API 문서(/{service}/docs*, /doc*, /redoc, /openapi.json) 접근 제어
#
# 내부망에서 게이트웨이로 직접 붙은 요청만 허용한다.
# 프록시(cloudflared/NPM) 경유 요청은 $remote_addr 가 클라이언트 IP 로 바뀌므로
# 헤더가 내부 IP 로 위조돼도 통과하지 않도록 실제 연결 주소($realip_remote_addr)가
# 프록시면 무조건 차단한다. 판정은 default.conf 의 if 한 줄.
# 프록시 IP 가 바뀌면 set_real_ip_from 과 $docs_via_proxy 를 함께 수정한다.
# -----------------------------------------------------------
geo $docs_lan {                     # $remote_addr 기준
    default        0;
    127.0.0.1/32   1;
    192.168.1.0/24 1;
    172.30.1.0/24  1;
}
geo $realip_remote_addr $docs_via_proxy {   # 실제 연결 주소가 신뢰 프록시면 1
    default         0;
    172.30.1.110/32 1;
    172.30.1.75/32  1;
    172.30.1.114/32 1;
}
# FastAPI: /docs, /docs/oauth2-redirect, /redoc, /openapi.json
# NestJS : /doc, /doc-json, /doc-yaml, /doc/swagger-ui-init.js (Express 는 경로 대소문자 무시 → ~*)
map $uri $docs_uri {
    default 0;
    ~*^/[^/]+/(docs?([/-].*)?|redoc|openapi\.json)$ 1;
}
# docs 요청(1) 이면서 "내부망(1) + 프록시 아님(0)" 조합이 아닐 때만 차단
map "$docs_uri$docs_lan$docs_via_proxy" $deny_docs {
    default 0;
    "100"   1;   # docs, 외부 IP, 직접
    "101"   1;   # docs, 외부 IP, 프록시 경유
    "111"   1;   # docs, 내부 IP 로 보이지만 프록시 경유 (헤더 위조)
}
