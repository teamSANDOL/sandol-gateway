# -----------------------------------------------------------
# JSON 액세스 로그
#
# 파일명이 00- 으로 시작하는 것은 필수다.
# nginx 는 conf.d/*.conf 를 알파벳 순으로 읽으므로, log_format 정의가
# default.conf 보다 먼저 로드되지 않으면 access_log 지시자가
# "unknown log format" 으로 기동에 실패한다.
# -----------------------------------------------------------

# 게이트웨이 앞에는 항상 프록시(cloudflared)가 있다는 전제로 시작한다.
# cloudflared 가 CF-Connecting-IP 로 실제 클라이언트 IP를 넘겨주므로
# 그 값으로 remote_addr 을 바꾼다. 원래 연결 주소(프록시 IP)는
# $realip_remote_addr 에 남는다.
set_real_ip_from 192.168.1.0/24;   # cloudflared 가 붙어 오는 대역. 바뀌면 여기만 수정
real_ip_header   CF-Connecting-IP;

log_format sandol_json escape=json
  '{"time":"$time_iso8601"'
  ',"remote_addr":"$remote_addr"'
  ',"proxy_addr":"$realip_remote_addr"'
  ',"host":"$host"'
  ',"xff":"$http_x_forwarded_for"'
  ',"method":"$request_method"'
  ',"uri":"$uri"'
  ',"status":$status'
  ',"request_time":$request_time'
  ',"upstream_time":"$upstream_response_time"'
  ',"bytes":$body_bytes_sent'
  ',"ua":"$http_user_agent"'
  '}';
