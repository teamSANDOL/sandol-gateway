# -----------------------------------------------------------
# Rate limit
#
# 파일명이 00- 으로 시작하는 것은 필수다.
# nginx 는 conf.d/*.conf 를 알파벳 순으로 읽으므로, 존 정의가
# default.conf 보다 먼저 로드되지 않으면 "unknown zone" 으로
# 기동에 실패한다.
# -----------------------------------------------------------

# 아래 로그에서 remote_addr 이 하나로 고정되면 프록시가 있는 것이고,
# 그때 주석을 풀고 대역을 채운다.
# set_real_ip_from  <프록시 대역>;
# real_ip_header    X-Forwarded-For;
# real_ip_recursive on;

# --- 관측용 JSON 로그 ---
log_format sandol_json escape=json
  '{"remote_addr":"$remote_addr"'
  ',"xff":"$http_x_forwarded_for"'
  ',"method":"$request_method"'
  ',"uri":"$uri"'
  ',"status":$status'
  ',"request_time":$request_time'
  ',"upstream_time":"$upstream_response_time"'
  ',"bytes":$body_bytes_sent'
  ',"ua":"$http_user_agent"'
  '}';

# zone 정의
limit_req_zone  $binary_remote_addr zone=rl_public:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=rl_auth:10m   rate=2r/s;
limit_req_zone  $binary_remote_addr zone=rl_heavy:10m  rate=1r/m;
limit_req_zone  $binary_remote_addr zone=rl_kakao:10m  rate=50r/s; # 차단 방지는 kakao-bot.conf 의 드라이런이 담당한다
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

# off로 세팅하면 그때부턴 차단 기능도 작동 시작
limit_req_dry_run  on;
limit_conn_dry_run on;

# 429로 응답 지정
limit_req_status   429;
limit_conn_status  429;
