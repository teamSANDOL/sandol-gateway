location = /auth { return 301 /auth/; }

location /auth/ {
    # 전용 네트워크 별칭: Keycloak이 게이트웨이를 keycloak_edge 대역 IP로 보게 함
    # 업스트림은 KEYCLOAK_UPSTREAM(host:port)에서 읽음. 기본 keycloak-edge:8080. IP 값도 resolver 없이 동작
    # (nginx 메인 컨텍스트에 `env KEYCLOAK_UPSTREAM; env KEYCLOAK_ADMIN_PUBLIC;` 선언 필요: 루트 compose의 gateway command)
    set_by_lua_block $up {
        local v = os.getenv("KEYCLOAK_UPSTREAM")
        if v == nil or v == "" then v = "keycloak-edge:8080" end
        return v
    }

    # 업스트림 스킴/Host/비밀 헤더. 기본값(http, Host=$host, 비밀 헤더 없음)은 기존 동작과 동일.
    # (nginx 메인 컨텍스트에 `env KEYCLOAK_UPSTREAM_SCHEME; env KEYCLOAK_UPSTREAM_HOST_HEADER; env KEYCLOAK_UPSTREAM_SECRET_HEADER;` 선언 필요)
    set_by_lua_block $up_scheme {
        local v = os.getenv("KEYCLOAK_UPSTREAM_SCHEME")
        if v ~= "https" then v = "http" end
        return v
    }
    # SNI·인증서 검증 대상 = 업스트림 호스트명(포트 제외). IPv6 리터럴 미지원
    set_by_lua_block $up_host { return (ngx.var.up:gsub(":%d+$", "")) }
    # Host 헤더: KEYCLOAK_UPSTREAM_HOST_HEADER > (https면 업스트림 호스트명, http면 클라이언트 $host)
    set_by_lua_block $up_host_header {
        local v = os.getenv("KEYCLOAK_UPSTREAM_HOST_HEADER")
        if v and v ~= "" then return v end
        if ngx.var.up_scheme == "https" then return ngx.var.up_host end
        return ngx.var.host
    }
    # 우회 방지용 공유 비밀 헤더(선택). 값이 비면 헤더를 보내지 않고 클라이언트가 보낸 같은 이름 헤더도 제거된다. 값은 로그에 남기지 않는다.
    set_by_lua_block $up_secret { return os.getenv("KEYCLOAK_UPSTREAM_SECRET_HEADER") or "" }
    proxy_set_header X-Origin-Verify $up_secret;
    include /etc/nginx/conf.d/routes/upstream-tls.inc;

    # KEYCLOAK_ADMIN_PUBLIC=off|false|0|no 이면 관리 콘솔·master realm 공개 경로 404 (기본: 허용)
    # ngx.var.uri 는 nginx가 디코딩·// 병합·dot-segment 정규화한 값이라 인코딩·슬래시 우회를 막는다
    access_by_lua_block {
        local f = (os.getenv("KEYCLOAK_ADMIN_PUBLIC") or ""):lower()
        if f == "off" or f == "false" or f == "0" or f == "no" then
            local u = ngx.var.uri:lower()
            if u:find("^/auth/admin") or u:find("^/auth/realms/master") then
                return ngx.exit(404)
            end
        end
    }
    proxy_pass $up_scheme://$up$request_uri;

    proxy_set_header Host               $up_host_header;
    proxy_set_header X-Real-IP          $remote_addr;
    # 클라이언트가 보낸 XFF를 이어 붙이면 Keycloak이 가장 왼쪽 값을 채택해 IP 위조가 되므로, real_ip 적용된 $remote_addr로 덮어씀
    proxy_set_header X-Forwarded-For    $remote_addr;
    proxy_set_header X-Forwarded-Proto  https;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Port   443;

    # Keycloak 인증 응답은 쿠키·Location 헤더가 커서 기본 4k/8k 버퍼를 넘긴다 (too big header -> 502)
    # 테스트 서버 실측: state 파라미터가 길어지면 헤더가 4096B(기본 proxy_buffer_size)를 넘어
    # 정확히 502가 재현됨 (3932B=200 / 4167B=502). 운영 장애(cloudflare-access client, 긴 state)도
    # 동일 원인으로 판단해 8배 여유를 둔 32k로 설정.
    proxy_buffer_size        32k;
    proxy_buffers            8 32k;
    proxy_busy_buffers_size  64k;
}
