location = /auth { return 301 /auth/; }

location /auth/ {
    # 전용 네트워크 별칭: Keycloak이 게이트웨이를 keycloak_edge 대역 IP로 보게 함
    set $up "keycloak-edge";
    proxy_pass http://$up:8080$request_uri;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    # 클라이언트가 보낸 XFF를 이어 붙이면 Keycloak이 가장 왼쪽 값을 채택해 IP 위조가 되므로, real_ip 적용된 $remote_addr로 덮어씀
    proxy_set_header X-Forwarded-For    $remote_addr;
    proxy_set_header X-Forwarded-Proto  https;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Port   443;

    # Keycloak 인증 응답은 쿠키·Location 헤더가 커서 기본 4k/8k 버퍼를 넘긴다 (too big header -> 502)
    # 테스트 서버 실측: state 파라미터가 길어지면 헤더가 4096B(기본 proxy_buffer_size)를 넘어
    # 정확히 502가 재현됨 (3932B=200 / 4167B=502). 운영 장애(cloudflare-access client, 긴 state)도
    # 동일 원인으로 판단해 8배 여유를 둔 32k로 설정.
    proxy_buffer_size        32k;
    proxy_buffers            8 32k;
    proxy_busy_buffers_size  64k;
}
