# -----------------------------------------------------------
# 🧭 NGINX 설정: auth-relay 서비스 요청 처리
# -----------------------------------------------------------
# 이 설정은 Gateway에서 /relay 경로로 들어온 요청을
# 내부 auth-relay 서비스로 프록시합니다.
# -----------------------------------------------------------

# 🚫 로그인 링크 발급은 인증 없는 서버 간 API: 공개 경로에서 차단 (챗봇은 AUTH_RELAY_URL 로 직접 호출)
# 접두사 매칭(^~)이라 하위 경로·끝 슬래시 변형도 막는다. nginx가 URI를 정규화한 뒤 매칭한다.
location ^~ /relay/issue_login_link { return 404; }

# ✅ /relay 경로 전체 프록시
location /relay/ {
    # 🔁 auth-relay 로 요청 프록시. 업스트림은 AUTH_RELAY_UPSTREAM(host:port), 기본 auth-relay:8000
    # (nginx 메인 컨텍스트에 `env AUTH_RELAY_UPSTREAM;` 선언 필요: 루트 compose의 gateway command)
    set_by_lua_block $up {
        local v = os.getenv("AUTH_RELAY_UPSTREAM")
        if v == nil or v == "" then v = "auth-relay:8000" end
        return v
    }


    # 업스트림 스킴/Host/비밀 헤더. 기본값(http, Host=$host, 비밀 헤더 없음)은 기존 동작과 동일.
    # (nginx 메인 컨텍스트에 `env AUTH_RELAY_UPSTREAM_SCHEME; env AUTH_RELAY_UPSTREAM_HOST_HEADER; env AUTH_RELAY_UPSTREAM_SECRET_HEADER;` 선언 필요)
    set_by_lua_block $up_scheme {
        local v = os.getenv("AUTH_RELAY_UPSTREAM_SCHEME")
        if v ~= "https" then v = "http" end
        return v
    }
    # SNI·인증서 검증 대상 = 업스트림 호스트명(포트 제외). IPv6 리터럴 미지원
    set_by_lua_block $up_host { return (ngx.var.up:gsub(":%d+$", "")) }
    # Host 헤더: AUTH_RELAY_UPSTREAM_HOST_HEADER > (https면 업스트림 호스트명, http면 클라이언트 $host)
    set_by_lua_block $up_host_header {
        local v = os.getenv("AUTH_RELAY_UPSTREAM_HOST_HEADER")
        if v and v ~= "" then return v end
        if ngx.var.up_scheme == "https" then return ngx.var.up_host end
        return ngx.var.host
    }
    # 우회 방지용 공유 비밀 헤더(선택). 값이 비면 헤더를 보내지 않고 클라이언트가 보낸 같은 이름 헤더도 제거된다. 값은 로그에 남기지 않는다.
    set_by_lua_block $up_secret { return os.getenv("AUTH_RELAY_UPSTREAM_SECRET_HEADER") or "" }
    proxy_set_header X-Origin-Verify $up_secret;
    include /etc/nginx/conf.d/routes/upstream-tls.inc;

    # 🔧 공통 헤더 설정 (사용자 정보 등)
    proxy_set_header Host $up_host_header;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-User-ID $http_x_user_id;
    proxy_set_header Origin $http_origin;

    proxy_pass $up_scheme://$up$request_uri;
}
