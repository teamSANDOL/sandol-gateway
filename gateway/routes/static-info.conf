
# /static-info 경로 전체를 static-info-service에 프록시
location /static-info/ {
    # TUK World 이미지 업로드(앱 한도 5MB) + multipart 여유
    client_max_body_size 6m;
    set $up "static-info-service";
    proxy_pass http://$up:80$request_uri;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 관리자 화면 OIDC·링크를 https로 만들기 위함 (앞단 프록시가 TLS 종단)
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-User-ID $http_x_user_id;
    proxy_set_header Origin $http_origin;
}