
# /static-info 경로 전체를 static-info-service에 프록시
location /static-info/ {
    set $up "static-info-service";
    limit_req  zone=rl_public burst=20 nodelay;
    proxy_pass http://$up:80$request_uri;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-User-ID $http_x_user_id;
    proxy_set_header Origin $http_origin;
}
# 증폭 경로. 요청 1건이 학교 iBook 서버로의 다중 아웃바운드 요청과
# 수 MB 메모리 적재로 불어난다. 캐시도 크기 상한도 없으므로 분리해서
# 가장 엄격한 존을 건다.
#
# location = 은 완전 일치이며 접두사 매칭(/static-info/)보다 우선순위가
# 높으므로 파일 내 순서는 무관하다. 다만 location 은 설정을 상속하지
# 않으므로 proxy_pass 와 헤더를 다시 써야 한다.
location = /static-info/bus/images {
    set $up "static-info-service";
    limit_req zone=rl_heavy burst=2;

    proxy_pass http://$up:80$request_uri;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-User-ID $http_x_user_id;
    proxy_set_header Origin $http_origin;
}
