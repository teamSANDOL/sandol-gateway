
# /static-info 경로 전체를 static-info-service에 프록시
location /static-info/ {
    set $up "static-info-service";
    limit_req  zone=rl_public burst=20 nodelay;
    proxy_pass http://$up:80$request_uri;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-User-ID $http_x_user_id;
    proxy_set_header Origin $http_origin;
}

# 셔틀 이미지 전체 조회. 이 경로는 다른 경로보다 훨씬 무거운 요청이 들어온다.
# 요청 1건이 들어오면 학교 서버로 이미지 개수만큼 요청이 나가고,
# 받은 이미지를 전부 메모리에 올린다. 캐싱이 아직 없어서 같은 요청이
# 100번 오면 100번 다시 받는다.
#
# 그래서 여기만 rl_heavy(분당 1회)로 따로 묶는다.
# /static-info/ 에 걸린 rl_public(초당 10회)은 이 경로에는 너무 헐겁다.
#
# location = 은 주소가 정확히 일치할 때만 적용된다.
# /static-info/ 같은 앞부분 매칭보다 우선하므로,
# 이 블록을 파일 어디에 두든 결과는 같다.
#
# 아래 proxy_pass 와 헤더는 위 /static-info/ 블록과 내용이 같지만
# 지우면 안 된다. location 끼리는 설정을 물려받지 않아서,
# 빼면 프록시가 아예 동작하지 않는다.
location = /static-info/bus/images {
    set $up "static-info-service";
    # nodelay 를 안 붙였다. 초과분을 즉시 통과시키지 않고 천천히 흘려보낸다.
    limit_req zone=rl_heavy burst=2;

    proxy_pass http://$up:80$request_uri;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-User-ID $http_x_user_id;
    proxy_set_header Origin $http_origin;
}
